<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Aadit Mehta, Full-Stack AI Builder</title>
  <desc id="desc">A dark futuristic banner with glossy three-dimensional technology icons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#07111d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <linearGradient id="js" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff36b"/><stop offset="1" stop-color="#f5c400"/></linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#55b7f3"/><stop offset="1" stop-color="#1976b8"/></linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53a9df"/><stop offset=".48" stop-color="#3776ab"/><stop offset=".52" stop-color="#ffd84a"/><stop offset="1" stop-color="#f4bd2f"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c084fc"/><stop offset=".48" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="textGlow" x="-30%" y="-50%" width="160%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity=".35"/></filter>
  </defs>

  <rect width="1200" height="430" rx="32" fill="url(#bg)"/>
  <ellipse cx="260" cy="140" rx="260" ry="220" fill="url(#glowBlue)" filter="url(#soft)"/>
  <ellipse cx="960" cy="290" rx="280" ry="220" fill="url(#glowPurple)" filter="url(#soft)"/>
  <path d="M0 345 C210 286 350 410 570 345 S960 265 1200 335 V430 H0Z" fill="#0ea5e9" opacity=".045"/>
  <path d="M0 370 C205 310 390 430 605 365 S965 300 1200 360" fill="none" stroke="#38bdf8" stroke-opacity=".13" stroke-width="2"/>
  <g opacity=".22" fill="#fff">
    <circle cx="92" cy="76" r="2"/><circle cx="180" cy="342" r="1.5"/><circle cx="1040" cy="72" r="2"/><circle cx="1120" cy="290" r="1.5"/><circle cx="890" cy="115" r="1"/><circle cx="390" cy="92" r="1.3"/>
  </g>

  <g filter="url(#shadow)" transform="translate(85 90) rotate(-7 70 70)">
    <rect width="140" height="140" rx="34" fill="url(#js)"/>
    <rect x="8" y="8" width="124" height="124" rx="27" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="4"/>
    <path d="M18 18 H122" stroke="#fff" stroke-opacity=".5" stroke-width="9" stroke-linecap="round"/>
    <text x="70" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#1f2937">JS</text>
  </g>

  <g filter="url(#shadow)" transform="translate(963 84) rotate(7 72 72)">
    <rect width="144" height="144" rx="35" fill="url(#ts)"/>
    <rect x="8" y="8" width="128" height="128" rx="28" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
    <path d="M20 18 H124" stroke="#fff" stroke-opacity=".42" stroke-width="9" stroke-linecap="round"/>
    <text x="72" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#fff">TS</text>
  </g>

  <g filter="url(#shadow)" transform="translate(155 265) rotate(6 54 54)">
    <rect width="108" height="108" rx="29" fill="url(#py)"/>
    <rect x="7" y="7" width="94" height="94" rx="22" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <text x="54" y="69" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#fff">PY</text>
  </g>

  <g filter="url(#shadow)" transform="translate(925 270) rotate(-5 54 54)">
    <rect width="108" height="108" rx="29" fill="url(#ai)"/>
    <rect x="7" y="7" width="94" height="94" rx="22" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <path d="M54 24 L61 46 L84 54 L61 62 L54 85 L46 62 L24 54 L46 46Z" fill="#fff"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <rect x="316" y="92" width="568" height="246" rx="35" fill="url(#glass)" stroke="#fff" stroke-opacity=".14"/>
    <rect x="328" y="104" width="544" height="222" rx="28" fill="#06101f" fill-opacity=".32" stroke="#38bdf8" stroke-opacity=".16"/>
    <text x="600" y="160" font-size="14" font-weight="700" letter-spacing="5" fill="#67e8f9">FULL-STACK AI BUILDER</text>
    <text x="600" y="228" font-size="58" font-weight="900" letter-spacing="1" fill="#f8fafc" filter="url(#textGlow)">AADIT MEHTA</text>
    <text x="600" y="272" font-size="19" font-weight="500" letter-spacing="1" fill="#cbd5e1">AI PRODUCTS  •  DEVELOPER TOOLS  •  MOBILE APPS</text>
    <g transform="translate(470 294)">
      <rect width="260" height="30" rx="15" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".26"/>
      <circle cx="18" cy="15" r="5" fill="#4ade80"/>
      <text x="138" y="20" font-size="12" font-weight="700" letter-spacing="2" fill="#bae6fd">BUILD  •  SHIP  •  LEARN</text>
    </g>
  </g>
</svg>